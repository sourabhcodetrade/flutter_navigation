plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // TODO: Add your own namespace.
    namespace = "com.example.flutter_setup"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.flutter_setup"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    flavorDimensions "flavor-type"

    // TODO: Add your own app name for the builds.
    productFlavors {
        local {
            dimension "flavor-type"
            applicationIdSuffix ".local"
            resValue "string", "app_name", "Flutter Setup local"
        }
        dev {
            dimension "flavor-type"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Flutter Setup Dev"
        }
        stage {
            dimension "flavor-type"
            applicationIdSuffix ".stage"
            resValue "string", "app_name", "Flutter Setup Stage"
        }
        preproduction {
            dimension "flavor-type"
            applicationIdSuffix ".preproduction"
            resValue "string", "app_name", "Flutter Setup Preprod"
        }
        prod {
            dimension "flavor-type"
            resValue "string", "app_name", "Flutter Setup"
        }
    }


}

flutter {
    source = "../.."
}
